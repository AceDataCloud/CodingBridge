name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate date-based version
        id: version
        run: |
          # 版本格式: YYYY.M.D.BUILD（BUILD 为当天构建序号，依据 PyPI 已发布版本递增）
          DATE_PREFIX=$(date +'%Y.%-m.%-d')

          pip install requests -q
          LATEST_BUILD=$(python -c "
          import requests
          try:
              resp = requests.get('https://pypi.org/pypi/coding-bridge/json', timeout=10)
              if resp.status_code == 200:
                  versions = resp.json().get('releases', {}).keys()
                  today_prefix = '${DATE_PREFIX}'
                  today_versions = [v for v in versions if v.startswith(today_prefix)]
                  builds = []
                  for v in today_versions:
                      parts = v.split('.')
                      if len(parts) == 4:
                          builds.append(int(parts[3]))
                  print(max(builds) + 1 if builds else 0)
              else:
                  print(0)
          except Exception:
              print(0)
          ")

          VERSION="${DATE_PREFIX}.${LATEST_BUILD}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python -c "
          import re
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'version = \"[^\"]+\"', f'version = \"$VERSION\"', content, count=1)
          with open('pyproject.toml', 'w') as f:
              f.write(content)
          "
          echo "Updated pyproject.toml to version $VERSION"
          grep -m1 "version" pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coding-bridge/${{ needs.build.outputs.version }}
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install "twine>=5.0,<6.1"
          twine check dist/*
          twine upload dist/*

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" dist/* \
            --title "v${{ needs.build.outputs.version }}" \
            --generate-notes \
            --repo '${{ github.repository }}' || echo "Release already exists, skipping"

  bump-packages:
    name: Bump Homebrew tap + Scoop bucket
    if: github.event_name == 'push'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve sdist url + sha256 from PyPI
        id: pypi
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Poll PyPI until the just-published version's sdist is queryable.
          for i in $(seq 1 30); do
            JSON=$(curl -fsS "https://pypi.org/pypi/coding-bridge/$VERSION/json" || true)
            if [ -n "$JSON" ]; then break; fi
            sleep 10
          done
          if [ -z "$JSON" ]; then echo "PyPI never served $VERSION"; exit 1; fi
          export JSON
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.loads(os.environ["JSON"])
          sd = next(u for u in d["urls"] if u["packagetype"] == "sdist")
          print(f"url={sd['url']}")
          print(f"sha256={sd['digests']['sha256']}")
          PY
      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.PACKAGES_BUMP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          URL: ${{ steps.pypi.outputs.url }}
          SHA: ${{ steps.pypi.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "PACKAGES_BUMP_TOKEN not set — skipping tap bump."; exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/AceDataCloud/homebrew-tap.git" tap
          F=tap/Formula/coding-bridge.rb
          python3 - "$F" "$URL" "$SHA" <<'PY'
          import re, sys
          path, url, sha = sys.argv[1:4]
          s = open(path).read()
          s = re.sub(r'url "https://files\.pythonhosted\.org/[^"]+"', f'url "{url}"', s, count=1)
          s = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', s, count=1)
          open(path, "w").write(s)
          PY
          cd tap
          if git diff --quiet; then echo "tap already current"; exit 0; fi
          git -c user.name="Ace Data Cloud Dev" -c user.email="dev@acedata.cloud" \
            commit -am "coding-bridge $VERSION"
          git push
          echo "note: dependency resource blocks are NOT auto-updated; run" \
               "\`brew update-python-resources\` when deps change."

      - name: Update Scoop manifest
        env:
          TAP_TOKEN: ${{ secrets.PACKAGES_BUMP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "PACKAGES_BUMP_TOKEN not set — skipping bucket bump."; exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/AceDataCloud/scoop-bucket.git" bucket
          python3 - bucket/bucket/coding-bridge.json "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1:3]
          d = json.load(open(path))
          d["version"] = version
          json.dump(d, open(path, "w"), indent=4)
          open(path, "a").write("\n")
          PY
          cd bucket
          if git diff --quiet; then echo "bucket already current"; exit 0; fi
          git -c user.name="Ace Data Cloud Dev" -c user.email="dev@acedata.cloud" \
            commit -am "coding-bridge $VERSION"
          git push

